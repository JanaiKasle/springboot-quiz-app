<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Master Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header class="quiz-header" id="quiz-header">
        <h1 class="heading">Master Quiz</h1>
    </header>

    <section class="auth-section">
        <div class="auth-card">

            <div class="auth-tabs">
                <button class="auth-tab active" id="login-tab" onclick="showForm('login')">Login</button>
                <button class="auth-tab" id="register-tab" onclick="showForm('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h2>Login</h2>
                <label for="login-username">Username</label>
                <input type="text" id="login-username" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>

                <button type="submit" class="btn">Login</button>
                <p id="login-message" class="auth-message"></p>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <h2>Register</h2>
                <label for="register-username">Username</label>
                <input type="text" id="register-username" required>

                <label for="register-password">Password</label>
                <input type="password" id="register-password" required minlength="6">

                <button type="submit" class="btn">Register</button>
                <p id="register-message" class="auth-message"></p>
            </form>

        </div>
    </section>

    <footer class="footer-section">
        <small>All Right Reserved</small>
        <small>Developed & Maintained By
            <a href="https://www.youtube.com/@GenieAshwani" target="_blank">Genie Ashwani</a>
        </small>
    </footer>

    <script src="auth.js"></script>
</body>
</html>

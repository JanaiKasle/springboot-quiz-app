<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Question - Master Quiz</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="auth.css">
    </head>
    <body>

        <header class="quiz-header" id="quiz-header">
            <h1 class="heading">Master Quiz — Admin</h1>
        </header>

        <section class="auth-section">
            <div class="auth-card" style="max-width: 500px;">

                <h2>Add a New Question</h2>

                <form id="add-question-form" class="auth-form">
                    <label for="question-text">Question</label>
                    <input type="text" id="question-text" required>

                    <label for="option-1">Option 1</label>
                    <input type="text" id="option-1" required>

                    <label for="option-2">Option 2</label>
                    <input type="text" id="option-2" required>

                    <label for="option-3">Option 3</label>
                    <input type="text" id="option-3" required>

                    <label for="option-4">Option 4</label>
                    <input type="text" id="option-4" required>

                    <label for="correct-answer">Correct Answer (must match one
                        option exactly)</label>
                    <input type="text" id="correct-answer" required>

                    <button type="submit" class="btn">Save Question</button>
                    <p id="add-question-message" class="auth-message"></p>
                </form>

            </div>
        </section>

        <footer class="footer-section">
            <small>All Right Reserved</small>
            <small>Developed & Maintained By
                <a href="https://www.youtube.com/@GenieAshwani"
                    target="_blank">Genie Ashwani</a>
            </small>
        </footer>

        <script src="add-question.js"></script>
    </body>
</html>
